<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>With Vibra: the menu bar shows every agent's state, and a notification says which one is waiting for you</title>
  <defs>
    <style>
      .t { fill: #1f2328; }
      .m { fill: #59636e; }
      .h { font-size: 11.5px; font-weight: 600; fill: #59636e; }
      .r { font-size: 13px; fill: #1f2328; }
      .s { font-size: 13px; fill: #6e7781; }
    </style>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbe7f5"/><stop offset="1" stop-color="#eadff2"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="399" rx="14" fill="url(#desk)" stroke="#d1d9e0"/>

  <!-- menu bar -->
  <path d="M1 30 V15 a14 14 0 0 1 14 -14 H865 a14 14 0 0 1 14 14 V30 Z" fill="#f3f3f3" fill-opacity="0.92"/>
  <text x="22" y="20" font-size="13" font-weight="600" class="t">Terminal</text>
  <text x="92" y="20" font-size="13" class="t">Shell   Edit   View   Window</text>
  <rect x="584" y="5" width="62" height="20" rx="5" fill="#d0d7de"/>
  <text x="615" y="20" font-size="13" font-weight="600" class="t" text-anchor="middle"><tspan fill="#0969da">2▶</tspan> <tspan fill="#bc4c00">2!</tspan></text>
  <text x="684" y="20" font-size="13" class="t">◐   ⌕</text>
  <text x="858" y="20" font-size="13" class="t" text-anchor="end">Sat 10:42</text>

  <!-- dropdown -->
  <g transform="translate(540,36)" filter="url(#sh)">
    <rect width="320" height="300" rx="10" fill="#fbfbfb" stroke="#d0d7de"/>
    <text x="14" y="26" class="h">Claude Code · 2</text>
    <rect x="6" y="33" width="308" height="26" rx="5" fill="#ffe8d6"/>
    <circle cx="22" cy="46" r="5" fill="#e16f24"/><text x="34" y="51" class="r" font-weight="600">jayskills</text><text x="306" y="51" font-size="13" fill="#bc4c00" font-weight="600" text-anchor="end">your turn · 12k tok</text>
    <circle cx="22" cy="73" r="5" fill="#0969da"/><text x="34" y="78" class="r">vibra</text><text x="306" y="78" class="s" text-anchor="end">working · 41k tok</text>
    <text x="14" y="112" class="h">Codex · 1</text>
    <circle cx="22" cy="132" r="5" fill="#0969da"/><text x="34" y="137" class="r">silex_poc</text><text x="306" y="137" class="s" text-anchor="end">working · 8k tok</text>
    <text x="14" y="168" class="h">OpenCode · 1</text>
    <circle cx="22" cy="189" r="5" fill="#d0d7de" stroke="#8c959f"/><text x="34" y="194" class="r">scratchpad</text><text x="306" y="194" class="s" text-anchor="end">idle · 10k tok</text>
    <text x="14" y="228" class="h">VS Code · 1</text>
    <rect x="6" y="235" width="308" height="26" rx="5" fill="#ffebe9"/>
    <circle cx="22" cy="248" r="5" fill="#cf222e"/><text x="34" y="253" class="r" font-weight="600">Fix the login flow</text><text x="306" y="253" font-size="13" fill="#cf222e" font-weight="600" text-anchor="end">needs approval · 3k tok</text>
    <line x1="10" y1="268" x2="310" y2="268" stroke="#d0d7de"/>
    <text x="14" y="289" class="r">Usage Report…</text><text x="306" y="289" class="s" text-anchor="end">⌘U</text>
  </g>

  <!-- notification -->
  <g transform="translate(160,52)" filter="url(#sh)">
    <rect width="340" height="70" rx="14" fill="#ffffff" fill-opacity="0.96" stroke="#d0d7de"/>
    <rect x="14" y="15" width="40" height="40" rx="9" fill="#1f2328"/>
    <text x="34" y="42" font-size="20" text-anchor="middle" fill="#fff">≋</text>
    <text x="66" y="31" font-size="13" font-weight="700" class="t">Vibra</text>
    <text x="326" y="31" font-size="11" class="m" text-anchor="end">now</text>
    <text x="66" y="51" font-size="13" class="t">jayskills is waiting for you</text>
  </g>
  <path d="M500 88 C 520 88, 525 82, 542 82" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- callouts -->
  <g font-size="13.5" class="t">
    <circle cx="44" cy="176" r="12" fill="#1f2328"/><text x="44" y="181" fill="#fff" text-anchor="middle" font-size="12" font-weight="700">1</text>
    <text x="66" y="173" font-weight="700">Glance at the menu bar.</text>
    <text x="66" y="192" class="m">2▶ means two are working. 2! means two need you.</text>

    <circle cx="44" cy="236" r="12" fill="#1f2328"/><text x="44" y="241" fill="#fff" text-anchor="middle" font-size="12" font-weight="700">2</text>
    <text x="66" y="233" font-weight="700">Get a tap on the shoulder.</text>
    <text x="66" y="252" class="m">A notification when an agent stops for you.</text>
    <text x="66" y="270" class="m">It goes away by itself once you have answered.</text>

    <circle cx="44" cy="314" r="12" fill="#1f2328"/><text x="44" y="319" fill="#fff" text-anchor="middle" font-size="12" font-weight="700">3</text>
    <text x="66" y="311" font-weight="700">Click to jump straight back.</text>
    <text x="66" y="330" class="m">To the terminal tab or app window it lives in.</text>
  </g>
</svg>
